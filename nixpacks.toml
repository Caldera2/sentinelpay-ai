[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm ci --include=dev --workspace @sentinelpay/shared --workspace @sentinelpay/api --workspace @sentinelpay/bigint-codec --include-workspace-root=true"
]

[phases.build]
cmds = [
  "npm run build --workspace @sentinelpay/shared",
  "npm run build --workspace @sentinelpay/api"
]

[start]
cmd = "npm run start --workspace @sentinelpay/api"
