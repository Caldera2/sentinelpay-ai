name: Audit and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinelpay_test
          POSTGRES_PASSWORD: sentinelpay_ci_only
          POSTGRES_DB: sentinelpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelpay_test -d sentinelpay_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm run security:scan
      - run: npm test
      - name: Exercise the PostgreSQL driver
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://sentinelpay_test:sentinelpay_ci_only@localhost:5432/sentinelpay_test
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise browser checkout and refunds
        run: npm run test:browser
        env:
          TEST_DATABASE_URL: postgres://sentinelpay_test:sentinelpay_ci_only@localhost:5432/sentinelpay_test
      - name: Audit all dependencies with the documented legacy exception
        run: npm run security:audit
